<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bytebimon</title>
    
    <!-- External Scripts -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7329195604411751"
     crossorigin="anonymous"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            min-height: 100%;
        }

        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: linear-gradient(135deg, #dbeafe, #fdf2f8);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        nav {
            margin-bottom: 20px;
        }

        .game-shell {
            width: min(100%, 560px);
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }

        .ui-panel {
            width: 100%;
            max-width: 480px;
            padding: 16px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.85);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        h1 {
            margin: 0;
            font-size: 1.6rem;
            text-align: center;
        }

        .action-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
        }

        .action-buttons button {
            margin-right: 8px;
            margin-top: 8px;
            padding: 8px 12px;
            cursor: pointer;
            animation: buttonAppear 0.25s ease-out;
        }

        .game-stage {
            width: min(100%, 420px);
            aspect-ratio: 5 / 4;
            border: 2px solid #333;
            border-radius: 16px;
            overflow: hidden;
            background: linear-gradient(180deg, #f0f0f0 0%, #d7ecff 100%);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: transparent;
        }

        @keyframes shakeStage {
            0% { transform: translate(0, 0); }
            20% { transform: translate(-6px, 3px); }
            40% { transform: translate(5px, -4px); }
            60% { transform: translate(-4px, -2px); }
            80% { transform: translate(3px, 2px); }
            100% { transform: translate(0, 0); }
        }

        .game-stage.shake {
            animation: shakeStage 0.35s ease-in-out;
        }

        @keyframes popInKeyframes {
            0% { transform: scale(0.4); opacity: 0; }
            60% { transform: scale(1.08); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        .pop-in {
            animation: popInKeyframes 0.4s ease-out;
        }

        @keyframes buttonAppear {
            0% { transform: translateY(6px) scale(0.9); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }

        .monster-placeholder {
            display: none;
        }

        .monster-placeholder svg {
            display: block;
            margin: 0 auto 8px;
        }

        .battle-arena {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            gap: 40px;
        }

        .player-monster, .enemy-monster {
            flex: 1;
            text-align: center;
        }
    </style>
</head>

<body>
    <!-- Navigation moved inside body -->
    <nav>
        <a href="Game.html">Game</a> |
        <a href="RaidHost.html">Raids</a> |
        <a href="about.html">About Me</a> |
        <a href="contact.html">Contact</a> |
        <a href="Home.html">Home</a> |
        <a href="Download.html">Download</a>
    </nav>

    <div class="game-shell">
        <div class="ui-panel">
            <h1>Bytebimon</h1>
            <div class="action-buttons">
                <button id="MenuButton" onclick="menu()">Menu</button>
                <button id="HostButton" onclick="hostMatch()" style="display: none;">Host Game</button>
                <button id="JoinButton" onclick="joinMatch()" style="display: none;">Join Game</button>
                <button id="RaidsButton" onclick="goToRaids()" style="display: none;">Raids (co-op)</button>
                <button id="SaveButton" onclick="save()">Save</button>
                <button id="feedButton" onclick="FeedButton()">Feed</button>
                <button id="sleepButton" onclick="SleepButton()">Sleep</button>
                <button id="trainButton" onclick="TrainButton()">Train</button>
                <button id="battleButton" onclick="battle()">Battle</button>
                <button id="StartButton" onclick="StartGame()" style="display: inline-block;">Start Game</button>
                <button id="onlineBattleButton" onclick="onlineBattle()" style="display: none;">Online Battle</button>
                <button id="localBattleButton" onclick="localBattle()" style="display: none;">Local Battle</button>
                <button id="settingsButton" onclick="settings()" style="display: none;">Settings</button>
                <button id="volumeButton" onclick="volume()" style="display: none;">Volume</button>
                <button id="updateButton" onclick="update()" style="display: none;">Update</button>
                <button id="AttackButton" onclick="Attack()" style="display: none;">Attack</button>
                <button id="NextButton" onclick="Next()" style="display: none;">Next</button>
                <button id="restartButton" onclick="restart()" style="display: none;">Restart</button>
                <button id="TrainDefenseButton" onclick="TdefenseButton()" style="display: none;">Train Defense</button>
                <button id="TrainAttackButton" onclick="TattackButton()" style="display: none;">Train Attack</button>
                <button id="TrainSpatialButton" onclick="TspatialButton()" style="display: none;">Train Spatial</button>
                <button id="backButton" onclick="Back()" style="display: none;">Back</button>
            </div>
        </div>
        <img id="Lose-image" src="Assets/lose.svg" alt="Lose-Image" style="display:none;">
        <img id="win-image" src="Assets/won.svg" alt="Win-Image" style="display:none;">
        <div class="game-stage">
            <canvas id="myCanvas" width="500" height="400"></canvas>
        </div>

        <div id="monsterPlaceholder" class="monster-placeholder player-monster" aria-live="polite">
            <svg width="96" height="96" viewBox="0 0 24 24" aria-hidden="true">
                <use href="#Mon"></use>
            </svg>
            <div id="monsterLabel">Ardumon placeholder</div>
        </div>

        <div id="enemyMonsterPlaceholder" class="monster-placeholder enemy-monster" aria-live="polite">
            <svg width="96" height="96" viewBox="0 0 24 24" aria-hidden="true">
                <use href="#Mon"></use>
            </svg>
            <div id="enemyMonsterLabel">Enemy Ardumon</div>
        </div>

        <div id="customDialogOverlay" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.7); z-index:9999; align-items:center; justify-content:center;">
            <div style="background:white; padding:20px; border-radius:10px; text-align:center; min-width:300px; max-width:80%; font-family:Arial; box-shadow: 0 4px 15px rgba(0,0,0,0.2);">
                <p id="customDialogMsg" style="color:black; margin-bottom:15px; font-size:18px;"></p>
                <input type="text" id="customDialogInput" style="display:none; margin-bottom:15px; width:100%; padding:10px; font-size:16px; border:1px solid #ccc; border-radius:5px;">
                <div style="display:flex; justify-content:center; gap:10px;">
                    <button id="customDialogOk" style="background:#007bff; color:white; border:none; padding:10px 20px; border-radius:5px; cursor:pointer; font-weight:bold; font-size:16px;">OK</button>
                    <button id="customDialogCancel" style="display:none; background:#ccc; color:black; border:none; padding:10px 20px; border-radius:5px; cursor:pointer; font-weight:bold; font-size:16px;">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Dialog Overlays & System Logic
        window.customAlert = function (msg) {
            return new Promise(resolve => {
                document.getElementById('customDialogOverlay').style.display = 'flex';
                document.getElementById('customDialogMsg').innerText = msg;
                document.getElementById('customDialogInput').style.display = 'none';
                document.getElementById('customDialogCancel').style.display = 'none';

                const okBtn = document.getElementById('customDialogOk');
                okBtn.onclick = function () {
                    document.getElementById('customDialogOverlay').style.display = 'none';
                    resolve();
                };
            });
        };

        window.customPrompt = function (msg, defaultVal) {
            return new Promise(resolve => {
                document.getElementById('customDialogOverlay').style.display = 'flex';
                document.getElementById('customDialogMsg').innerText = msg;
                const input = document.getElementById('customDialogInput');
                input.style.display = 'block';
                input.value = defaultVal || '';
                document.getElementById('customDialogCancel').style.display = 'inline-block';

                const okBtn = document.getElementById('customDialogOk');
                okBtn.onclick = function () {
                    document.getElementById('customDialogOverlay').style.display = 'none';
                    resolve(input.value);
                };

                const cancelBtn = document.getElementById('customDialogCancel');
                cancelBtn.onclick = function () {
                    document.getElementById('customDialogOverlay').style.display = 'none';
                    resolve(null);
                };
            });
        };

        const canvas = document.getElementById('myCanvas');
        const ctx = canvas.getContext('2d');

        let hunger = 20;
        let stats = { attack: 0, defense: 0 };
        let health = 10;
        let defence = 0;
        let currentmon = null;
        let mute = false;
        let timer = 0;
        let requirements = null;
        let Enemymon = null;
        let turn = "";
        let playerBattleHealth = 0;
        let enemyBattleHealth = 0;
        let currentHP = 0;
        let maxPlayerHP = 0;
        let updateMon = [];
        let peer = null;
        let conn = null;
        let timerInterval = null;
        let isHost = false;
        let isOnlineBattle = false;
        let EvoCheck = 0;
        let effort = 0;

        let gamestate = "idle";
        let inBattle = false;
        let currentVersion;
        const delay = ms => new Promise(res => setTimeout(res, ms));
        let animationState = { type: 'idle', startTime: performance.now(), duration: 700, actor: 'player' };
        let damagePopups = [];
        let shakeUntil = 0;
        let shakeMagnitude = 0;

        // Bar dimensions and positions
        let barX = 100;
        let barY = 320;
        let barWidth = 300;
        let barHeight = 25;

        // Sweet spot bounds
        let targetX = 225;
        let targetWidth = 50;

        // Indicator position and physics
        let needleX = barX;
        let needleSpeed = 5;
        let movingRight = true;

        // Game state variables
        let timingState = "PLAYING";
        let scoreText = "";

        const SPATIAL_CONFIG = {
            WIN_SCORE: 10,
            MAX_HEALTH: 3,
            PLAYER_SPEED: 5,
            HAZARD_SPEED: 3
        };

        let spatialGameState = "MENU";
        let spatialScore = 0;
        let spatialHealth = SPATIAL_CONFIG.MAX_HEALTH;
        let spatialPlayer = { x: 250, y: 320, r: 16 };
        let spatialTarget = { x: 0, y: 0, r: 12 };
        let spatialHazards = [];
        let activeKeys = {};

        function triggerAnimation(type, duration = 600, actor = 'player') {
            animationState = { type, startTime: performance.now(), duration, actor };
        }

        function spawnDamagePopup(amount, side) {
            damagePopups.push({ amount, side, startTime: performance.now() });
        }

        function triggerShake(duration = 300, magnitude = 6) {
            shakeUntil = performance.now() + duration;
            shakeMagnitude = magnitude;
            const stage = document.querySelector('.game-stage');
            if (stage) {
                stage.classList.remove('shake');
                void stage.offsetWidth;
                stage.classList.add('shake');
                setTimeout(() => stage.classList.remove('shake'), duration);
            }
        }

        function popIn(el) {
            if (!el) return;
            el.classList.remove('pop-in');
            void el.offsetWidth;
            el.classList.add('pop-in');
        }

        function animateFrame(now) {
            drawGameScene(now);
            requestAnimationFrame(animateFrame);
        }

        const winImg = document.getElementById("win-image");
        const LosImg = document.getElementById("Lose-image");

        const BaseMon = [
            {
                id: 0,
                name: "corumon",
                type: "unknown",
                BattleStats: { attack: 5, defense: 3, speed: 2, health: 10 },
                evoTime: 120,
                spriteData: [
                    { type: "ellipse", cx: 12, cy: 15, rx: 7, ry: 6, fill: "#4F6CF3" },
                    { type: "ellipse", cx: 12, cy: 12, rx: 5.2, ry: 4.4, fill: "#6A8BFF" },
                    { type: "ellipse", cx: 9.5, cy: 10.8, rx: 1.2, ry: 1.4, fill: "#0F172A" },
                    { type: "ellipse", cx: 14.5, cy: 10.8, rx: 1.2, ry: 1.4, fill: "#0F172A" },
                    { type: "polygon", points: "10,8 8,5 12,6", fill: "#2D4CC8" },
                    { type: "polygon", points: "14,8 16,5 12,6", fill: "#2D4CC8" },
                    { type: "rect", x: 9, y: 14, width: 6, height: 3, fill: "#1D4ED8" },
                    { type: "ellipse", cx: 12, cy: 15.2, rx: 6.2, ry: 1.6, fill: "rgba(15, 23, 42, 0.18)" }
                ]
            }
            // Additional monsters...
        ];

        function initializeGame() {
            updateGameState();
            loadUpdates();
        }

        async function loadUpdates() {
            try {
                const response = await fetch('Update.json');
                if (response.ok) {
                    updateMon = await response.json();
                    console.log("Update monsters loaded:", updateMon);
                }
            } catch (e) {
                console.warn("Could not load Update.json:", e);
            }
        }

        function restart() {
            const gameData = {
                hunger: 20,
                stats: { attack: 0, defense: 0 },
                health: 10,
                currentmon: null,
                mute: false,
                timer: 0,
                requirements: null,
                Enemymon: null,
                turn: "",
                playerBattleHealth: 0,
                enemyBattleHealth: 0,
                currentHP: 0,
                maxPlayerHP: 0,
                gamestate: "TitleScreen",
                inBattle: false
            };
            localStorage.setItem('ardumonGameData', JSON.stringify(gameData));
            console.log("Game reset.");
            load();
            updateGameState();
        }

        function Back() {
            hideButtons();
            hideBattleButtons();
            hideTrainButtons();
            gamestate = "idle";
            updateGameState();
            winImg.style.display = "none";
            LosImg.style.display = "none";
        }

        function updateGameState() {
            switch (gamestate) {
                case "TitleScreen":
                    TitleScreen();
                    document.getElementById('SaveButton').style.display = 'none';
                    break;

                case "idle":
                    if (!currentmon) {
                        egg();
                    }
                    document.getElementById('restartButton').style.display = 'none';
                    document.getElementById('MenuButton').style.display = 'inline-block';
                    document.getElementById('feedButton').style.display = 'none';
                    document.getElementById('sleepButton').style.display = 'none';
                    document.getElementById('trainButton').style.display = 'none';
                    document.getElementById('battleButton').style.display = 'inline-block';
                    document.getElementById('onlineBattleButton').style.display = 'none';
                    document.getElementById('localBattleButton').style.display = 'none';
                    document.getElementById('AttackButton').style.display = 'none';
                    document.getElementById('NextButton').style.display = 'none';
                    document.getElementById('TrainAttackButton').style.display = 'none';
                    document.getElementById('TrainDefenseButton').style.display = 'none';
                    document.getElementById('TrainSpatialButton').style.display = 'none';
                    document.getElementById('StartButton').style.display = 'none';
                    document.getElementById('SaveButton').style.display = 'inline-block';
                    winImg.style.display = "none";
                    LosImg.style.display = "none";
                    showMonster();
                    if (!timerInterval) startTimer();
                    break;

                case "menu":
                    break;

                case "battle":
                    break;

                case "train_spatial":
                    hideButtons();
                    hideBattleButtons();
                    hideTrainButtons();
                    document.getElementById('backButton').style.display = 'inline-block';
                    spatialGameState = "MENU";
                    break;
            }
        }

        function TitleScreen() {
            console.log("Displaying Title Screen...");
            const width = canvas.width || 500;
            const height = canvas.height || 400;
            ctx.clearRect(0, 0, width, height);

            const bg = ctx.createLinearGradient(0, 0, 0, height);
            bg.addColorStop(0, '#f7fbff');
            bg.addColorStop(1, '#d8ecff');
            ctx.fillStyle = bg;
            ctx.fillRect(0, 0, width, height);

            ctx.fillStyle = '#1f2937';
            ctx.textAlign = 'center';
            ctx.font = 'bold 24px Arial';
            ctx.fillText('Bytebimon', width / 2, height / 2 - 20);
            ctx.font = '16px Arial';
            ctx.fillText('Press Start Game to begin', width / 2, height / 2 + 16);

            const hiddenButtons = [
                'MenuButton', 'feedButton', 'sleepButton', 'trainButton', 'battleButton',
                'onlineBattleButton', 'localBattleButton', 'HostButton', 'JoinButton', 'RaidsButton',
                'settingsButton', 'volumeButton',
                'updateButton', 'AttackButton', 'NextButton', 'TrainDefenseButton', 'TrainAttackButton', 'TrainSpatialButton', 'restartButton'
            ];
            hiddenButtons.forEach((id) => {
                const button = document.getElementById(id);
                if (button) button.style.display = 'none';
            });

            const placeholder = document.getElementById('monsterPlaceholder');
            if (placeholder) placeholder.style.display = 'none';
            const enemyPlaceholder = document.getElementById('enemyMonsterPlaceholder');
            if (enemyPlaceholder) enemyPlaceholder.style.display = 'none';

            const startButton = document.getElementById('StartButton');
            if (startButton) startButton.style.display = 'inline-block';
        }

        function load() {
            const savedData = localStorage.getItem('ardumonGameData');
            if (savedData) {
                const gameData = JSON.parse(savedData);
                hunger = gameData.hunger;
                stats = gameData.stats;
                health = gameData.health;
                currentmon = gameData.currentmon;
                mute = gameData.mute;
                timer = gameData.timer;
                requirements = gameData.requirements;
                Enemymon = gameData.Enemymon;
                turn = gameData.turn;
                playerBattleHealth = gameData.playerBattleHealth;
                enemyBattleHealth = gameData.enemyBattleHealth;
                currentHP = gameData.currentHP;
                maxPlayerHP = gameData.maxPlayerHP;
                gamestate = gameData.gamestate;
                inBattle = gameData.inBattle;
            }
        }

        // Initialize on load
        window.onload = initializeGame;
    </script>
</body>
</html>
