    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: linear-gradient(135deg, #dbeafe, #fdf2f8);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .game-shell {
            width: min(100%, 560px);
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }

        .ui-panel {
            width: 100%;
            max-width: 480px;
            padding: 16px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.85);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        h1 {
            margin: 0;
            font-size: 1.6rem;
            text-align: center;
        }

        .action-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
        }

        .game-stage {
            width: min(100%, 420px);
            aspect-ratio: 5 / 4;
            border: 2px solid #333;
            border-radius: 16px;
            overflow: hidden;
            background: linear-gradient(180deg, #f0f0f0 0%, #d7ecff 100%);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: transparent;
        }

        .action-buttons button {
            margin-right: 8px;
            margin-top: 8px;
            padding: 8px 12px;
            cursor: pointer;
        }

        @keyframes shakeStage {
            0% { transform: translate(0, 0); }
            20% { transform: translate(-6px, 3px); }
            40% { transform: translate(5px, -4px); }
            60% { transform: translate(-4px, -2px); }
            80% { transform: translate(3px, 2px); }
            100% { transform: translate(0, 0); }
        }

        .game-stage.shake {
            animation: shakeStage 0.35s ease-in-out;
        }

        @keyframes popInKeyframes {
            0% { transform: scale(0.4); opacity: 0; }
            60% { transform: scale(1.08); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        .pop-in {
            animation: popInKeyframes 0.4s ease-out;
        }

        @keyframes buttonAppear {
            0% { transform: translateY(6px) scale(0.9); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }

        .action-buttons button {
            animation: buttonAppear 0.25s ease-out;
        }

        .monster-placeholder {
            display: none !important;
        }

        .monster-placeholder svg {
            display: block;
            margin: 0 auto 8px;
        }

        .battle-arena {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            gap: 40px;
        }

        .player-monster {
            flex: 1;
            text-align: center;
        }

        .enemy-monster {
            flex: 1;
            text-align: center;
        }
    </style>

                return new Promise(resolve => {
                    document.getElementById('customDialogOverlay').style.display = 'flex';
                    document.getElementById('customDialogMsg').innerText = msg;
                    document.getElementById('customDialogInput').style.display = 'none';
                    document.getElementById('customDialogCancel').style.display = 'none';

                    const okBtn = document.getElementById('customDialogOk');
                    okBtn.onclick = function () {
                        document.getElementById('customDialogOverlay').style.display = 'none';
                        resolve();
                    };
                });
            };

                    input.value = defaultVal || '';
                    document.getElementById('customDialogCancel').style.display = 'inline-block';

                    const okBtn = document.getElementById('customDialogOk');
                    okBtn.onclick = function () {
                        document.getElementById('customDialogOverlay').style.display = 'none';
                        resolve(input.value);
                    };

                    const cancelBtn = document.getElementById('customDialogCancel');

            function resizeCanvas() {
                const stage = canvas.parentElement;
                if (!stage) return;

                const ratio = window.devicePixelRatio || 1;
                const width = stage.clientWidth || 500;
                const height = stage.clientHeight || 400;

                canvas.width = Math.round(width * ratio);
                canvas.height = Math.round(height * ratio);
                ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
                drawGameScene();
            }

            function drawSpriteToCanvas(spriteData, x, y, scale) {
                if (!spriteData || spriteData.length === 0) return;

                spriteData.forEach(shape => {
                    if (shape.type === 'circle') {
                        ctx.beginPath();
                        ctx.arc(x + shape.cx * scale, y + shape.cy * scale, shape.r * scale, 0, Math.PI * 2);
                        ctx.fillStyle = shape.fill;
                        ctx.fill();
                    } else if (shape.type === 'rect') {
                        ctx.fillStyle = shape.fill;
                        ctx.fillRect(x + shape.x * scale, y + shape.y * scale, shape.width * scale, shape.height * scale);
                    } else if (shape.type === 'ellipse') {
                        ctx.beginPath();
                        ctx.ellipse(x + shape.cx * scale, y + shape.cy * scale, shape.rx * scale, shape.ry * scale, 0, 0, Math.PI * 2);
                        ctx.fillStyle = shape.fill;
                        ctx.fill();
                    } else if (shape.type === 'polygon') {
                        const points = shape.points.split(' ').map(point => point.split(',').map(Number));
                        if (points.length === 0) return;
                        ctx.beginPath();
                        ctx.moveTo(x + points[0][0] * scale, y + points[0][1] * scale);
                        points.slice(1).forEach(([px, py]) => ctx.lineTo(x + px * scale, y + py * scale));
                        ctx.closePath();
                        ctx.fillStyle = shape.fill;
                        ctx.fill();
                    }
                });
            }

            function getSpriteBounds(spriteData) {
                if (!spriteData || spriteData.length === 0) {
                    return { minX: 0, minY: 0, maxX: 24, maxY: 24 };
                }

                let minX = Infinity;
                let minY = Infinity;
                let maxX = -Infinity;
                let maxY = -Infinity;

                spriteData.forEach(shape => {
                    if (shape.type === 'circle') {
                        minX = Math.min(minX, shape.cx - shape.r);
                        minY = Math.min(minY, shape.cy - shape.r);
                        maxX = Math.max(maxX, shape.cx + shape.r);
                        maxY = Math.max(maxY, shape.cy + shape.r);
                    } else if (shape.type === 'rect') {
                        minX = Math.min(minX, shape.x);
                        minY = Math.min(minY, shape.y);
                        maxX = Math.max(maxX, shape.x + shape.width);
                        maxY = Math.max(maxY, shape.y + shape.height);
                    } else if (shape.type === 'ellipse') {
                        minX = Math.min(minX, shape.cx - shape.rx);
                        minY = Math.min(minY, shape.cy - shape.ry);
                        maxX = Math.max(maxX, shape.cx + shape.rx);
                        maxY = Math.max(maxY, shape.cy + shape.ry);
                    } else if (shape.type === 'polygon') {
                        const points = shape.points.split(' ').map(point => point.split(',').map(Number));
                        points.forEach(([px, py]) => {
                            minX = Math.min(minX, px);
                            minY = Math.min(minY, py);
                            maxX = Math.max(maxX, px);
                            maxY = Math.max(maxY, py);
                        });
                    }
                });

                if (!Number.isFinite(minX)) {
                    return { minX: 0, minY: 0, maxX: 24, maxY: 24 };
                }

                return { minX, minY, maxX, maxY };
            }

            function drawTimingMeter() {
                if (!inBattle || turn !== 'player') return;

                // Move Needle
                if (timingState === "PLAYING") {
                    if (movingRight) {
                        needleX += needleSpeed;
                        if (needleX >= barX + barWidth) movingRight = false;
                    } else {
                        needleX -= needleSpeed;
                        if (needleX <= barX) movingRight = true;
                    }
                }

                // Meter Background Frame
                ctx.fillStyle = "#333333";
                ctx.fillRect(barX, barY, barWidth, barHeight);
                ctx.strokeStyle = "#FFFFFF";
                ctx.lineWidth = 2;
                ctx.strokeRect(barX, barY, barWidth, barHeight);

                // Sweet Spot Zone
                ctx.fillStyle = "rgba(76, 175, 80, 0.8)";
                ctx.fillRect(targetX, barY, targetWidth, barHeight);

                // Indicator Needle
                ctx.strokeStyle = "#FFD700";
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(needleX, barY - 4);
                ctx.lineTo(needleX, barY + barHeight + 4);
                ctx.stroke();

                // Instructions or Feedback text
                ctx.fillStyle = "#1F2937";
                ctx.font = "bold 12px Arial";
                ctx.textAlign = "center";
                if (scoreText) {
                    ctx.fillText(scoreText, barX + barWidth / 2, barY - 8);
                } else {
                    ctx.fillText("Click or Press Space for Critical Hit!", barX + barWidth / 2, barY - 8);
                }
            }

            function checkTiming() {
                if (timingState === "PLAYING") {
                    if (needleX >= targetX && needleX <= targetX + targetWidth) {
                        timingState = "SUCCESS";
                        scoreText = "CRITICAL HIT!";
                        effort = 0; // Bonus/Normal damage
                    } else {
                        timingState = "MISS";
                        scoreText = "MISSED!";
                        effort = 9; // Reduction penalty
                    }
                } else {
                    // Reset Timing Meter
                    timingState = "PLAYING";
                    needleX = barX;
                    movingRight = true;
                    scoreText = "";
                }
            }

            // SPATIAL AVOIDANCE MINIGAME ENGINE
            // ==========================================

            function startSpatialTraining() {
                spatialScore = 0;
                spatialHealth = SPATIAL_CONFIG.MAX_HEALTH;
                spatialPlayer.x = 250;
                spatialPlayer.y = 320;
                spatialHazards = [];
                spawnSpatialTarget();
                spatialGameState = "TRAINING";
            }

            function spawnSpatialTarget() {
                spatialTarget.x = Math.random() * 440 + 30;
                spatialTarget.y = Math.random() * 260 + 80;
            }

            function renderSpatialMinigame(width, height) {
                ctx.fillStyle = "#1e293b";
                ctx.fillRect(0, 0, width, height);

                switch (spatialGameState) {
                    case "MENU":
                        drawSpatialMenu(width, height);
                        break;
                    case "TRAINING":
                        updateAndDrawSpatialTraining(width, height);
                        break;
                    case "VICTORY":
                        drawSpatialEndScreen(true, width, height);
                        break;
                    case "GAME_OVER":
                        drawSpatialEndScreen(false, width, height);
                        break;
                }
            }

            function drawSpatialMenu(width, height) {
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 22px Arial";
                ctx.textAlign = "center";
                ctx.fillText("HAZARD AVOIDANCE TRAINING", width / 2, height / 2 - 40);

                ctx.font = "14px Arial";
                ctx.fillStyle = "#cbd5e1";
                ctx.fillText("Collect green energy nodes while dodging red hazards.", width / 2, height / 2 - 10);
                ctx.fillText("Use ARROW KEYS or WASD to move your Bytebimon.", width / 2, height / 2 + 15);

                ctx.fillStyle = "#3b82f6";
                ctx.fillRect(width / 2 - 90, height / 2 + 45, 180, 40);
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 16px Arial";
                ctx.fillText("PRESS SPACE", width / 2, height / 2 + 70);
            }

            function updateAndDrawSpatialTraining(width, height) {
                // Movement Handling
                if (activeKeys['ArrowLeft'] || activeKeys['KeyA']) spatialPlayer.x -= SPATIAL_CONFIG.PLAYER_SPEED;
                if (activeKeys['ArrowRight'] || activeKeys['KeyD']) spatialPlayer.x += SPATIAL_CONFIG.PLAYER_SPEED;
                if (activeKeys['ArrowUp'] || activeKeys['KeyW']) spatialPlayer.y -= SPATIAL_CONFIG.PLAYER_SPEED;
                if (activeKeys['ArrowDown'] || activeKeys['KeyS']) spatialPlayer.y += SPATIAL_CONFIG.PLAYER_SPEED;

                // Bounds Constraint
                spatialPlayer.x = Math.max(spatialPlayer.r, Math.min(width - spatialPlayer.r, spatialPlayer.x));
                spatialPlayer.y = Math.max(50 + spatialPlayer.r, Math.min(height - spatialPlayer.r, spatialPlayer.y));

                // Spawn Hazards Periodically
                if (Math.floor(performance.now() / 16) % 40 === 0) {
                    spatialHazards.push({
                        x: Math.random() * (width - 40) + 20,
                        y: -10,
                        r: Math.random() * 8 + 10,
                        speed: Math.random() * 3 + SPATIAL_CONFIG.HAZARD_SPEED
                    });
                }

                // Update & Render Hazards
                for (let i = spatialHazards.length - 1; i >= 0; i--) {
                    let h = spatialHazards[i];
                    h.y += h.speed;

                    ctx.fillStyle = "#ef4444";
                    ctx.beginPath();
                    ctx.arc(h.x, h.y, h.r, 0, Math.PI * 2);
                    ctx.fill();

                    // Collision Check with Hazards
                    let dx = spatialPlayer.x - h.x;
                    let dy = spatialPlayer.y - h.y;
                    let dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < spatialPlayer.r + h.r) {
                        spatialHealth--;
                        spatialHazards.splice(i, 1);
                        if (spatialHealth <= 0) {
                            spatialGameState = "GAME_OVER";
                        }
                        continue;
                    }

                    if (h.y > height + 20) spatialHazards.splice(i, 1);
                }

                // Target Handling
                let targetDx = spatialPlayer.x - spatialTarget.x;
                let targetDy = spatialPlayer.y - spatialTarget.y;
                let targetDist = Math.sqrt(targetDx * targetDx + targetDy * targetDy);

                if (targetDist < spatialPlayer.r + spatialTarget.r) {
                    spatialScore++;
                    if (spatialScore >= SPATIAL_CONFIG.WIN_SCORE) {
                        spatialGameState = "VICTORY";
                        // Stat Rewards
                        stats.defense += 1;
                        if (currentmon && currentmon.BattleStats) {
                            currentmon.BattleStats.defense += 1;
                        }
                        hunger = Math.max(0, hunger - 1);
                    } else {
                        spawnSpatialTarget();
                    }
                }

                // Render Target
                ctx.fillStyle = "#10b981";
                ctx.beginPath();
                ctx.arc(spatialTarget.x, spatialTarget.y, spatialTarget.r, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = "#ffffff";
                ctx.lineWidth = 2;
                ctx.stroke();

                // Render Player Avatar (Using Currentmon Sprite Data)
                if (currentmon && currentmon.spriteData) {
                    const scale = 1.2;
                    const bounds = getSpriteBounds(currentmon.spriteData);
                    const spriteWidth = (bounds.maxX - bounds.minX) * scale;
                    const spriteHeight = (bounds.maxY - bounds.minY) * scale;
                    const spriteX = spatialPlayer.x - spriteWidth / 2 - bounds.minX * scale;
                    const spriteY = spatialPlayer.y - spriteHeight / 2 - bounds.minY * scale;

                    ctx.save();
                    ctx.translate(spriteX, spriteY);
                    drawSpriteToCanvas(currentmon.spriteData, 0, 0, scale);
                    ctx.restore();
                } else {
                    ctx.fillStyle = "#3b82f6";
                    ctx.beginPath();
                    ctx.arc(spatialPlayer.x, spatialPlayer.y, spatialPlayer.r, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Render HUD Header
                ctx.fillStyle = "rgba(15, 23, 42, 0.75)";
                ctx.fillRect(0, 0, width, 40);

                ctx.fillStyle = "#ffffff";
                ctx.font = "14px Arial";
                ctx.textAlign = "left";
                ctx.fillText(`Targets: ${spatialScore} / ${SPATIAL_CONFIG.WIN_SCORE}`, 15, 25);

                ctx.textAlign = "right";
                let hpHearts = "";
                for (let i = 0; i < SPATIAL_CONFIG.MAX_HEALTH; i++) {
                    hpHearts += (i < spatialHealth) ? "❤️ " : "🖤 ";
                }
                ctx.fillText(`HP: ${hpHearts}`, width - 15, 25);
            }

            function drawSpatialEndScreen(isVictory, width, height) {
                ctx.textAlign = "center";
                ctx.font = "bold 24px Arial";

                if (isVictory) {
                    ctx.fillStyle = "#10b981";
                    ctx.fillText("TRAINING PASSED!", width / 2, height / 2 - 30);
                    ctx.fillStyle = "#cbd5e1";
                    ctx.font = "14px Arial";
                    ctx.fillText("+1 Defense Stat Earned!", width / 2, height / 2);
                } else {
                    ctx.fillStyle = "#ef4444";
                    ctx.fillText("HAZARD LIMIT REACHED", width / 2, height / 2 - 30);
                }

                ctx.fillStyle = "#ffffff";
                ctx.font = "16px Arial";
                ctx.fillText(`Final Score: ${spatialScore}`, width / 2, height / 2 + 30);
                ctx.fillText("Press [R] to Retry or Back to Exit", width / 2, height / 2 + 60);
            }

            function drawGameScene(timestamp = performance.now()) {
                const width = canvas.width / (window.devicePixelRatio || 1) || 500;
                const height = canvas.height / (window.devicePixelRatio || 1) || 400;
                ctx.clearRect(0, 0, width, height);

                if (gamestate === "train_spatial") {
                    renderSpatialMinigame(width, height);
                    return;
                }

                const bg = ctx.createLinearGradient(0, 0, 0, height);
                bg.addColorStop(0, '#f7fbff');
                bg.addColorStop(1, '#d8ecff');
                ctx.fillStyle = bg;
                ctx.fillRect(0, 0, width, height);

                ctx.strokeStyle = 'rgba(0, 0, 0, 0.15)';
                ctx.lineWidth = 1;
                for (let i = 0; i < width; i += 24) {
                    ctx.beginPath();
                    ctx.moveTo(i, 0);
                    ctx.lineTo(i, height);
                    ctx.stroke();
                }
                for (let i = 0; i < height; i += 24) {
                    ctx.beginPath();
                    ctx.moveTo(0, i);
                    ctx.lineTo(width, i);
                    ctx.stroke();
                }

                ctx.fillStyle = '#1f2937';
                ctx.font = 'bold 20px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('Bytebimon', width / 2, 32);

                if (gamestate === "TitleScreen") {
                    ctx.font = '16px Arial';
                    ctx.fillText('Press Start Game to begin', width / 2, height / 2 + 16);
                    return;
                }

                const elapsed = timestamp - animationState.startTime;
                const progress = Math.min(1, elapsed / Math.max(1, animationState.duration));
                const bob = animationState.type === 'idle' ? Math.sin(timestamp / 300) * 6 : animationState.type === 'bounce' ? Math.sin(progress * Math.PI) * 8 : 0;
                const pulse = animationState.type === 'battle-start' ? 1 + Math.sin(progress * Math.PI) * 0.15 : animationState.type === 'attack' ? 1 + Math.sin(progress * Math.PI * 2) * 0.08 : 1;
                const flashAlpha = animationState.type === 'battle-start' || animationState.type === 'attack' ? Math.max(0, 0.25 * (1 - progress)) : 0;
                let playerOffset = 0;
                let enemyOffset = 0;
                if (animationState.type === 'attack') {
                    const lungeProgress = Math.min(1, progress * 2);
                    const attackDistance = 20 * Math.sin(lungeProgress * Math.PI);
                    const recoil = Math.sin(progress * Math.PI * 6) * 3 * (1 - progress);
                    if (animationState.actor === 'player') {
                        playerOffset = attackDistance;
                        enemyOffset = recoil;
                    } else {
                        enemyOffset = -attackDistance;
                        playerOffset = -recoil;
                    }
                }

                let shakeX = 0, shakeY = 0;
                if (timestamp < shakeUntil) {
                    shakeX = (Math.random() - 0.5) * 2 * shakeMagnitude;
                    shakeY = (Math.random() - 0.5) * 2 * shakeMagnitude;
                }
                ctx.save();
                ctx.translate(shakeX, shakeY);

                if (flashAlpha > 0) {
                    ctx.save();
                    ctx.fillStyle = `rgba(255,255,255,${flashAlpha})`;
                    ctx.fillRect(0, 0, width, height);
                    ctx.restore();
                }

                if (inBattle && Enemymon && gamestate === 'battle' && currentmon && currentmon.spriteData) {
                    const scale = Math.min(width, height) * 0.01;
                    const playerBounds = getSpriteBounds(currentmon.spriteData);
                    const enemyBounds = getSpriteBounds(Enemymon.spriteData);
                    const playerWidth = (playerBounds.maxX - playerBounds.minX) * scale;
                    const enemyWidth = (enemyBounds.maxX - enemyBounds.minX) * scale;
                    const playerBaseX = width * 0.26 - playerWidth / 2 - playerBounds.minX * scale + playerOffset;
                    const enemyBaseX = width * 0.74 - enemyWidth / 2 - enemyBounds.minX * scale + enemyOffset;
                    const monsterY = height * 0.5 + bob;

                    ctx.save();
                    ctx.translate(playerBaseX, monsterY);
                    ctx.scale(pulse, pulse);
                    drawSpriteToCanvas(currentmon.spriteData, 0, 0, scale);
                    ctx.restore();

                    ctx.save();
                    ctx.translate(enemyBaseX, monsterY);
                    ctx.scale(pulse, pulse);
                    drawSpriteToCanvas(Enemymon.spriteData, 0, 0, scale);
                    ctx.restore();

                    ctx.font = '14px Arial';
                    ctx.fillText(`${currentmon.name}`, width * 0.26, height - 120);
                    ctx.fillText(`${Enemymon.name}`, width * 0.74, height - 120);
                    ctx.font = '12px Arial';
                    ctx.fillText(`HP ${currentHP}/${maxPlayerHP}`, width * 0.26, height - 104);
                    ctx.fillText(`HP ${enemyBattleHealth}/${Enemymon.BattleStats.health}`, width * 0.74, height - 104);

                    const hpBarWidth = width * 0.32;
                    const playerHpRatio = Math.max(0, Math.min(1, currentHP / Math.max(1, maxPlayerHP)));
                    const enemyHpRatio = Math.max(0, Math.min(1, enemyBattleHealth / Math.max(1, Enemymon.BattleStats.health)));
                    drawHpBar(width * 0.26 - hpBarWidth / 2, height - 92, hpBarWidth, playerHpRatio);
                    drawHpBar(width * 0.74 - hpBarWidth / 2, height - 92, hpBarWidth, enemyHpRatio);

                    damagePopups = damagePopups.filter(popup => timestamp - popup.startTime < 800);
                    damagePopups.forEach(popup => {
                        const age = (timestamp - popup.startTime) / 800;
                        const x = popup.side === 'player' ? width * 0.26 : width * 0.74;
                        const y = monsterY - 20 - age * 26;
                        ctx.save();
                        ctx.globalAlpha = Math.max(0, 1 - age);
                        ctx.fillStyle = '#dc2626';
                        ctx.font = 'bold 18px Arial';
                        ctx.fillText(`-${popup.amount}`, x, y);
                        ctx.restore();
                    });

                    // Draw the Precision Timing Bar when fighting
                    drawTimingMeter();

                } else if (currentmon && currentmon.spriteData) {
                    const scale = Math.min(width, height) * 0.04;
                    const bounds = getSpriteBounds(currentmon.spriteData);
                    const spriteWidth = (bounds.maxX - bounds.minX) * scale;
                    const spriteHeight = (bounds.maxY - bounds.minY) * scale;
                    const spriteX = width / 2 - spriteWidth / 2 - bounds.minX * scale;
                    const spriteY = height / 2 - spriteHeight / 2 - bounds.minY * scale + bob;
                    ctx.save();
                    ctx.translate(spriteX, spriteY);
                    ctx.scale(pulse, pulse);
                    drawSpriteToCanvas(currentmon.spriteData, 0, 0, scale);
                    ctx.restore();

                    ctx.font = '16px Arial';
                    ctx.fillText(`${currentmon.name}`, width / 2, height - 64);
                    ctx.font = '14px Arial';
                    ctx.fillText(`Hunger: ${hunger.toFixed(1)} | Health: ${health} | Attack: ${stats.attack} | Defense: ${stats.defense}`, width / 2, height - 40);
                } else {
                    ctx.font = '18px Arial';
                    ctx.fillText('Hatching...', width / 2, height / 2);
                }

                ctx.restore();
            }

            function drawHpBar(x, y, width, ratio) {
                const barH = 6;
                ctx.save();
                ctx.fillStyle = 'rgba(15, 23, 42, 0.15)';
                ctx.fillRect(x, y, width, barH);
                const fillColor = ratio > 0.5 ? '#22c55e' : ratio > 0.2 ? '#f59e0b' : '#ef4444';
                ctx.fillStyle = fillColor;
                ctx.fillRect(x, y, width * ratio, barH);
                ctx.strokeStyle = 'rgba(15, 23, 42, 0.3)';
                ctx.lineWidth = 1;
                ctx.strokeRect(x, y, width, barH);
                ctx.restore();
            }

            window.addEventListener('load', () => {
                initializeGame();
                resizeCanvas();
                requestAnimationFrame(animateFrame);
            });
            window.addEventListener('resize', resizeCanvas);

            window.addEventListener('keydown', (e) => {
                activeKeys[e.code] = true;

                if (e.code === "Space" && inBattle && turn === "player") {
                    checkTiming();
                }

                if (gamestate === "train_spatial") {
                    if (e.code === "Space" && spatialGameState === "MENU") {
                        startSpatialTraining();
                    }
                    if ((e.key === "r" || e.key === "R") && (spatialGameState === "GAME_OVER" || spatialGameState === "VICTORY")) {
                        startSpatialTraining();
                    }
                }
            });

            window.addEventListener('keyup', (e) => {
                activeKeys[e.code] = false;
            });

            canvas.addEventListener('mousedown', () => {
                if (inBattle && turn === "player") {
                    checkTiming();
                }
            });

            function hungerDecay() {
                hunger -= 0.1;
                if (hunger < 0) hunger = 0;
                console.log("Hunger decreased to: " + hunger);
                updateMonsterDisplay();
                if (hunger === 0) {
                    health -= 1;
                    if (health < 0) health = 0;
                }

                if (health === 0) {
                    console.log("Monster is dead");
                    customAlert("Your ByteBimon Has sadly died from hunger, You should have fed it on time, how do you feel about yourself");
                    restart();
                }
            }

            function startTimer() {
                if (timerInterval) return;

                timerInterval = setInterval(() => {
                    timer += 1;
                    EvoCheck += 1;
                    hungerDecay();
                    console.log('1 second has passed');

                    if (EvoCheck === 3) {
                        Evolve();
                        EvoCheck = 0;
                    }
                }, 1000);
            }

            function renderSprite(spriteData) {
                if (!spriteData || spriteData.length === 0) return '';

                let svgContent = '';
                spriteData.forEach(shape => {
                    if (shape.type === 'circle') {
                        svgContent += `<circle cx="${shape.cx}" cy="${shape.cy}" r="${shape.r}" fill="${shape.fill}" />`;
                    } else if (shape.type === 'rect') {
                        svgContent += `<rect x="${shape.x}" y="${shape.y}" width="${shape.width}" height="${shape.height}" fill="${shape.fill}" />`;
                    } else if (shape.type === 'polygon') {
                        svgContent += `<polygon points="${shape.points}" fill="${shape.fill}" />`;
                    }
                });
                return svgContent;
            }

            function showMonster() {
                const placeholder = document.getElementById('monsterPlaceholder');
                const svg = document.querySelector('#monsterPlaceholder svg');
                if (placeholder) {
                    placeholder.style.display = 'none';
                }
                if (svg && currentmon && currentmon.spriteData) {
                    svg.innerHTML = renderSprite(currentmon.spriteData);
                }
                drawGameScene();
            }

            function showEnemyMonster() {
                const placeholder = document.getElementById('enemyMonsterPlaceholder');
                const svg = document.querySelector('#enemyMonsterPlaceholder svg');
                if (placeholder) {
                    placeholder.style.display = 'none';
                }
                if (svg && Enemymon && Enemymon.spriteData) {
                    svg.innerHTML = renderSprite(Enemymon.spriteData);
                }
                const label = document.getElementById('enemyMonsterLabel');
                if (label && Enemymon) {
                    label.textContent = `${Enemymon.name} | HP: ${Enemymon.BattleStats.health}`;
                }
            }

            function updateMonsterDisplay() {
                const label = document.getElementById('monsterLabel');
                if (!label || !currentmon) return;

                if (inBattle && gamestate === 'battle') {
                    updateBattleDisplay();
                    return;
                }

                label.textContent = `${currentmon.name} | Hunger: ${hunger.toFixed(1)} | Health: ${health} | Attack: ${stats.attack} | Defense: ${stats.defense}`;
                drawGameScene();
            }

            function menu() {
                console.log("Opening menu...");
                gamestate = "menu";
                winImg.style.display = "none";
                LosImg.style.display = "none";
                document.getElementById('onlineBattleButton').style.display = 'none';
                document.getElementById('localBattleButton').style.display = 'none';
                document.getElementById('MenuButton').style.display = 'none';
                document.getElementById('feedButton').style.display = 'inline-block';
                document.getElementById('sleepButton').style.display = 'inline-block';
                document.getElementById('trainButton').style.display = 'inline-block';
                document.getElementById('battleButton').style.display = 'inline-block';
                document.getElementById('settingsButton').style.display = 'inline-block';
                document.getElementById('backButton').style.display = 'inline-block';
            }

            function egg() {
                console.log("Hatching from an egg...");
                initRandomMon();
            }

            function initRandomMon() {
                const chosenArray = (Math.random() < 0.5 && updateMon.length > 0) ? updateMon : BaseMon;
                const randomIndex = Math.floor(Math.random() * chosenArray.length);
                currentmon = JSON.parse(JSON.stringify(chosenArray[randomIndex]));
                console.log(`A wild ${currentmon.name} has appeared!`);
                updateMonsterDisplay();
            }

            function FeedButton() {
                hunger += 10;
                if (hunger > 20) hunger = 20;
                triggerAnimation('bounce', 400);
                console.log("Feeding Ardumon. Hunger is now: " + hunger);
                updateMonsterDisplay();
                hideButtons();
                gamestate = "idle";
                updateGameState();
            }

            function SleepButton() {
                health += 5;
                if (health > 20) health = 20;
                triggerAnimation('bounce', 400);
                console.log("Ardumon is sleeping. Health is now: " + health);
                updateMonsterDisplay();
                hideButtons();
                gamestate = "idle";
                updateGameState();
            }

            function hideTrainButtons() {
                document.getElementById('TrainAttackButton').style.display = 'none';
                document.getElementById('TrainDefenseButton').style.display = 'none';
                document.getElementById('TrainSpatialButton').style.display = 'none';
            }

            function TrainButton() {
                document.getElementById('TrainAttackButton').style.display = 'inline-block';
                document.getElementById('TrainDefenseButton').style.display = 'inline-block';
                document.getElementById('TrainSpatialButton').style.display = 'inline-block';
                hideButtons();
                hideBattleButtons();
                document.getElementById('backButton').style.display = 'inline-block';
            }

            function TspatialButton() {
                gamestate = "train_spatial";
                updateGameState();
            }

            function TattackButton() {
                stats.attack += 1;
                if (currentmon && currentmon.BattleStats) {
                    currentmon.BattleStats.attack += 1;
                }
                customAlert(`Attack is now at ${stats.attack}`);
                console.log("Training completed. Attack is now: " + stats.attack);
                updateMonsterDisplay();
                hideButtons();
                hideTrainButtons();
                gamestate = "idle";
                updateGameState();
                if (currentmon && currentmon.BattleStats && currentmon.BattleStats.attack >= 11) {
                    currentmon.BattleStats.attack = 10;
                    customAlert("attack is max");
                }
            }

            function TdefenseButton() {
                stats.defense += 1;
                if (currentmon && currentmon.BattleStats) {
                    currentmon.BattleStats.defense += 1;
                }
                customAlert(`Defense is now at ${stats.defense}`);
                console.log("Training completed. Defense is now: " + stats.defense);
                updateMonsterDisplay();
                hideButtons();
                hideTrainButtons();
                gamestate = "idle";
                updateGameState();
                if (stats.defense >= 11) {
                    stats.defense = 10;
                    customAlert("Defense is max");
                }
            }

            function getPlayerDamage() {
                const baseAtk = currentmon?.BattleStats?.attack ?? 1;
                const defense = Enemymon?.BattleStats?.defense ?? 0;
                const effectiveAttack = Math.max(1, baseAtk - effort);
                return Math.max(1, effectiveAttack - defense);
            }

            function getEnemyDamage() {
                const attack = Enemymon?.BattleStats?.attack ?? 1;
                const defense = currentmon?.BattleStats?.defense ?? 0;
                return Math.max(1, attack - defense);
            }

            function resetBattleHP() {
                damagePopups = [];
                shakeUntil = 0;
                if (currentmon && currentmon.BattleStats) {
                    maxPlayerHP = Math.max(1, currentmon.BattleStats.health);
                    currentHP = maxPlayerHP;
                } else {
                    maxPlayerHP = 10;
                    currentHP = maxPlayerHP;
                }
                playerBattleHealth = currentHP;
                enemyBattleHealth = Enemymon ? Math.max(1, Enemymon.BattleStats.health) : 10;
            }

            function Attack() {
                if (turn !== "player") return;
                triggerAnimation('attack', 350, 'player');
                const damage = getPlayerDamage();
                enemyBattleHealth = Math.max(0, enemyBattleHealth - damage);
                console.log(`${currentmon.name} attacks for ${damage} damage!`);
                spawnDamagePopup(damage, 'enemy');
                triggerShake(280, 5);
                updateBattleDisplay();

                if (enemyBattleHealth <= 0) {
                    customAlert(`Victory! ${currentmon.name} defeated ${Enemymon.name}!`);
                    if (isOnlineBattle) {
                        sendGameData({ type: 'attack', damage: damage });
                    }
                    endBattle();
                    winImg.style.display = "block";
                    popIn(winImg);
                    setTimeout(() => {
                        winImg.style.display = "none";
                    }, 3000);
                    return;
                }

                turn = "enemy";
                document.getElementById('AttackButton').style.display = 'none';
                if (isOnlineBattle) {
                    sendGameData({ type: 'attack', damage: damage });
                    document.getElementById('NextButton').style.display = 'none';
                } else {
                    document.getElementById('NextButton').style.display = 'inline-block';
                }

                // Reset timing state for next turn
                timingState = "PLAYING";
                needleX = barX;
                scoreText = "";
            }

            function Next() {
                if (turn === "enemy") {
                    enemyTurn();
                }
            }

            function enemyTurn() {
                triggerAnimation('attack', 350, 'enemy');
                const damage = getEnemyDamage();
                currentHP = Math.max(0, currentHP - damage);
                playerBattleHealth = currentHP;
                console.log(`${Enemymon.name} attacks for ${damage} damage!`);
                spawnDamagePopup(damage, 'player');
                triggerShake(280, 5);
                updateBattleDisplay();

                if (playerBattleHealth <= 0) {
                    customAlert(`Defeat! ${currentmon.name} lost to ${Enemymon.name}!`);
                    endBattle();
                    LosImg.style.display = "block";
                    popIn(LosImg);
                    setTimeout(() => {
                        LosImg.style.display = "none";
                    }, 3000);
                    return;
                }

                turn = "player";
                document.getElementById('AttackButton').style.display = 'inline-block';
                document.getElementById('NextButton').style.display = 'none';
            }

            function updateBattleDisplay() {
                const playerLabel = document.getElementById('monsterLabel');
                if (playerLabel) {
                    playerLabel.textContent = `${currentmon.name} | HP: ${currentHP}/${maxPlayerHP}`;
                }
                const enemyLabel = document.getElementById('enemyMonsterLabel');
                if (enemyLabel) {
                    enemyLabel.textContent = `${Enemymon.name} | HP: ${enemyBattleHealth}/${Enemymon.BattleStats.health}`;
                }
                drawGameScene();
            }

            function endBattle() {
                document.getElementById('AttackButton').style.display = 'none';
                document.getElementById('NextButton').style.display = 'none';
                inBattle = false;
                gamestate = "idle";
                if (conn) {
                    try { conn.close(); } catch (e) { }
                    conn = null;
                }
                if (peer) {
                    try { peer.destroy(); } catch (e) { }
                    peer = null;
                }
                isOnlineBattle = false;
                isHost = false;
                updateMonsterDisplay();
                updateGameState();
            }

            function battle() {
                gamestate = "battle";
                console.log("Entering battle menu...");
                hideButtons();
                document.getElementById('MenuButton').style.display = 'none';
                document.getElementById('onlineBattleButton').style.display = 'inline-block';
                document.getElementById('localBattleButton').style.display = 'inline-block';
                document.getElementById('backButton').style.display = 'inline-block';
            }

            function onlineBattle() {
                console.log('Starting online battle...');
                hideTrainButtons();
                hideButtons();
                document.getElementById('HostButton').style.display = 'inline-block';
                document.getElementById('JoinButton').style.display = 'inline-block';
                document.getElementById('RaidsButton').style.display = 'inline-block';
                document.getElementById('MenuButton').style.display = 'none';
                document.getElementById('onlineBattleButton').style.display = 'none';
                document.getElementById('localBattleButton').style.display = 'none';
                document.getElementById('backButton').style.display = 'inline-block';
            }

            function goToRaids() {
                window.location.href = 'RaidHost.html';
            }

            function hostMatch() {
                isHost = true;
                isOnlineBattle = true;
                hideBattleButtons();

                if (peer) { try { peer.destroy(); } catch (e) { } }

                const roomCode = 'BYTEBI-' + Math.random().toString(36).substring(2, 6).toUpperCase();
                console.log("Hosting match with room code:", roomCode);

                peer = new Peer(roomCode);

                peer.on('open', (id) => {
                    customPrompt('Your Room Code (share this with your opponent):', id);
                    console.log('Waiting for opponent to join with code:', id);
                });

                peer.on('connection', (incomingConn) => {
                    conn = incomingConn;
                    setupPeerConnection(conn);
                });

                peer.on('error', (err) => {
                    console.error('PeerJS error:', err);
                    if (err.type === 'unavailable-id') {
                        customAlert('Room code already in use. Try hosting again.');
                    } else {
                        customAlert('Connection error: ' + err.message);
                    }
                    endBattle();
                });
            }

            async function joinMatch() {
                const roomCode = await customPrompt('Enter the Room Code from the host:');
                if (!roomCode || !roomCode.trim()) {
                    console.log('Join cancelled.');
                    return;
                }

                const cleanedCode = roomCode.trim();

                if (cleanedCode.toUpperCase().startsWith('BYTEBI')) {
                    isHost = false;
                    isOnlineBattle = true;
                    hideBattleButtons();

                    if (peer) { try { peer.destroy(); } catch (e) { } }

                    peer = new Peer();

                    peer.on('open', () => {
                        console.log('Connecting to host:', cleanedCode);
                        conn = peer.connect(cleanedCode);
                        setupPeerConnection(conn);
                    });

                    peer.on('error', (err) => {
                        console.error('PeerJS error:', err);
                        customAlert('Could not connect: ' + err.message);
                        endBattle();
                    });
                } else if (cleanedCode.toUpperCase().startsWith('BYTERAID')) {
                    await customAlert('That is a raid code! Taking you to the Raid page to join up with your team.');
                    try { sessionStorage.setItem('pendingRaidCode', cleanedCode); } catch (e) { }
                    window.location.href = 'RaidHost.html';
                } else {
                    customAlert('That room code was not recognized. Double check it and try again.');
                }
            }

            function setupPeerConnection(connection) {
                connection.on('open', () => {
                    console.log('CONNECTED to match!');
                    if (!currentmon) {
                        initRandomMon();
                    }
                    connection.send({ type: 'init', monster: currentmon });
                });

                connection.on('data', (data) => {
                    try {
                        handleIncomingGameData(data);
                    } catch (e) {
                        console.error('Failed to handle game data:', e);
                    }
                });

                connection.on('close', () => {
                    console.log('Peer connection closed.');
                    if (inBattle) {
                        customAlert('Multiplayer connection lost.');
                        endBattle();
                    }
                });

                connection.on('error', (err) => {
                    console.error('Connection error:', err);
                    customAlert('Connection error.');
                    endBattle();
                });
            }

            function sendGameData(data) {
                if (conn && conn.open) {
                    conn.send(data);
                }
            }

            function handleIncomingGameData(data) {
                if (!data) return;

                if (data.type === 'init') {
                    Enemymon = data.monster;
                    inBattle = true;
                    gamestate = 'battle';
                    triggerAnimation('battle-start', 800);
                    hideButtons();
                    hideBattleButtons();

                    resetBattleHP();

                    console.log(`Connected to peer! Enemy ${Enemymon.name} appeared!`);
                    showMonster();
                    showEnemyMonster();
                    updateBattleDisplay();

                    if (isHost) {
                        const startTurn = Math.random() < 0.5 ? 'player' : 'enemy';
                        turn = startTurn;
                        sendGameData({ type: 'start', turn: startTurn === 'player' ? 'enemy' : 'player' });
                        document.getElementById('AttackButton').style.display = turn === 'player' ? 'inline-block' : 'none';
                        document.getElementById('NextButton').style.display = 'none';
                    }
                } else if (data.type === 'start') {
                    turn = data.turn;
                    console.log(`Battle started. It is ${turn}'s turn.`);
                    document.getElementById('AttackButton').style.display = turn === 'player' ? 'inline-block' : 'none';
                    document.getElementById('NextButton').style.display = 'none';
                } else if (data.type === 'attack') {
                    triggerAnimation('attack', 350, 'enemy');
                    const damage = data.damage;
                    currentHP = Math.max(0, currentHP - damage);
                    playerBattleHealth = currentHP;
                    spawnDamagePopup(damage, 'player');
                    triggerShake(280, 5);
                    updateBattleDisplay();

                    if (playerBattleHealth <= 0) {
                        customAlert(`Defeat! ${currentmon.name} lost to ${Enemymon.name}!`);
                        endBattle();
                        LosImg.style.display = "block";
                        popIn(LosImg);
                        setTimeout(() => {
                            LosImg.style.display = "none";
                        }, 3000);
                        return;
                    }

                    turn = "player";
                    document.getElementById('AttackButton').style.display = 'inline-block';
                    document.getElementById('NextButton').style.display = 'none';
                }
            }

            function localBattle() {
                console.log('Starting local battle...');
                hideTrainButtons();
                hideBattleButtons();
                startBattle();
            }

            function pickRandomEnemyMonster() {
                if (!currentmon) {
                    initRandomMon();
                }
                let enemyIndex = Math.floor(Math.random() * BaseMon.length);
                while (BaseMon[enemyIndex].id === currentmon.id && BaseMon.length > 1) {
                    enemyIndex = Math.floor(Math.random() * BaseMon.length);
                }
                return JSON.parse(JSON.stringify(BaseMon[enemyIndex]));
            }

            function startBattle() {
                if (!currentmon) {
                    initRandomMon();
                }

                Enemymon = pickRandomEnemyMonster();
                if (!Enemymon) return;

                inBattle = true;
                gamestate = 'battle';
                triggerAnimation('battle-start', 800);
                hideButtons();

                resetBattleHP();
                showMonster();
                showEnemyMonster();
                updateBattleDisplay();
                initRandomTurn();
            }

            function initRandomTurn() {
                turn = Math.random() < 0.5 ? 'player' : 'enemy';
                console.log(`${turn}'s turn!`);
                if (turn === 'player') {
                    document.getElementById('AttackButton').style.display = 'inline-block';
                    document.getElementById('NextButton').style.display = 'none';
                } else {
                    document.getElementById('AttackButton').style.display = 'none';
                    document.getElementById('NextButton').style.display = 'inline-block';
                }
            }

            function Evolve() {
                if (currentmon && requirements) {
                    if (timer >= currentmon.evoTime) {
                        if (stats.attack >= (requirements.attack || 0) && stats.defense >= (requirements.defense || 0)) {
                            console.log("Evolving", currentmon.name);
                        } else {
                            console.log("Requirements not met for evolution.");
                        }
                    } else {
                        console.log("Not enough time has passed to evolve.");
                    }
                }
            }

            function hideButtons() {
                document.getElementById('feedButton').style.display = 'none';
                document.getElementById('sleepButton').style.display = 'none';
                document.getElementById('trainButton').style.display = 'none';
                document.getElementById('battleButton').style.display = 'none';
                document.getElementById('volumeButton').style.display = 'none';
                document.getElementById('updateButton').style.display = 'none';
                document.getElementById('SaveButton').style.display = 'none';
                document.getElementById('settingsButton').style.display = 'none';
                document.getElementById('backButton').style.display = 'none';
            }

            function hideBattleButtons() {
                document.getElementById('onlineBattleButton').style.display = 'none';
                document.getElementById('localBattleButton').style.display = 'none';
                document.getElementById('HostButton').style.display = 'none';
                document.getElementById('JoinButton').style.display = 'none';
                document.getElementById('RaidsButton').style.display = 'none';
                document.getElementById('MenuButton').style.display = 'none';
            }

            function settings() {
                console.log("Opening settings...");
                hideButtons();
                hideBattleButtons();
                document.getElementById('settingsButton').style.display = 'none';
                document.getElementById('volumeButton').style.display = 'inline-block';
                document.getElementById('updateButton').style.display = 'inline-block';
                document.getElementById('SaveButton').style.display = 'inline-block';
                document.getElementById('restartButton').style.display = 'inline-block';
                document.getElementById('backButton').style.display = 'inline-block';
            }

            function volume() {
                mute = !mute;
                console.log("Mute is now: " + mute);
                gamestate = "idle";
                hideButtons();
                updateGameState();
            }

            async function update() {
                console.log("Checking for updates...");
                try {
                    // Prompt user to pick a JSON update file
                    const [fileHandle] = await window.showOpenFilePicker({
                        types: [{
                            description: 'JSON Update Files',
                            accept: { 'application/json': ['.json'] }
                        }]
                    });

                    // 1. Get the File object
                    const file = await fileHandle.getFile();

                    // 2. Read the actual text content inside the file
                    const fileContent = await file.text();

                    // 3. Parse JSON data from file
                    const updateData = JSON.parse(fileContent);

                    // 4. Update state using the data from the file
                    gamestate = updateData.status || "idle";

                    hideButtons();
                    updateGameState();
                } catch (err) {
                    if (err.name !== 'AbortError') {
                        console.error("Failed to load update file:", err);
                        customAlert("Could not read update file.");
                    }
                }
            }
        </script>
    </div>
</body>
