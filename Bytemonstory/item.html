<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f4f4f9;
        }
        
        .header-panel {
            background: #fff;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .inventory-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .item-card {
            background: white;
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            width: 150px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .item-card h3 {
            margin: 0 0 15px 0;
            font-size: 18px;
            color: #333;
        }

        .use-btn {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }

        .use-btn:hover {
            background-color: #218838;
        }

        .empty-message {
            font-style: italic;
            color: #777;
        }
    </style>
</head>
<body>

    <div class="header-panel">
        <h1>🎒 Your Inventory & Companion</h1>
        
        <hr>
        
        <!-- Monster Stat Display -->
        <h3>🐾 Active Monster Stats</h3>
        <div id="MonsterStats">
            <p>Loading monster data...</p>
        </div>
    </div>

    <!-- Inventory Grid -->
    <div id="InventoryGrid" class="inventory-grid"></div>

    <script>
        const inventoryGrid = document.getElementById("InventoryGrid");
        const monsterStatsDiv = document.getElementById("MonsterStats");

        let myMonster = null;

        // --- 1. LOAD MONSTER DATA ---
        function load() {
            const savedData = localStorage.getItem('ardumonGameData');
            if (savedData) {
                const gameData = JSON.parse(savedData);
                if (gameData.currentmon) {
                    myMonster = gameData.currentmon;
                    updateMonsterDisplay();
                    return;
                }
            }
            // Fallback default monster if none is saved yet
            else {
                myMonster = {
                    name: "Ardumon",
                    attack: 10,
                    defense: 10,
                    speed: 10,
                    hp: 50,
                    level: 1
                };
                saveGameData();
                updateMonsterDisplay();
            }
        }

        // --- 2. SAVE MONSTER DATA ---
        function saveGameData() {
            if (myMonster) {
                let gameData = JSON.parse(localStorage.getItem('ardumonGameData')) || {};
                gameData.currentmon = myMonster;
                localStorage.setItem('ardumonGameData', JSON.stringify(gameData));
            }
        }

        // --- 3. UPDATE HTML DISPLAY ---
        function updateMonsterDisplay() {
            if (myMonster) {
                myMonster.attack = myMonster.attack || 0;
                myMonster.defense = myMonster.defense || 0;
                myMonster.speed = myMonster.speed || 0;
                myMonster.hp = myMonster.hp || 0;
                myMonster.level = myMonster.level || 1;

                monsterStatsDiv.innerHTML = `
                    <strong>Name:</strong> ${myMonster.name} <br>
                    <strong>Level:</strong> ${myMonster.level} <br>
                    <strong>HP:</strong> ${myMonster.hp} <br>
                    <strong>Attack (ATK):</strong> ${myMonster.attack} <br>
                    <strong>Defense (DEF):</strong> ${myMonster.defense} <br>
                    <strong>Speed (SPD):</strong> ${myMonster.speed}
                `;
            }
        }

        // --- 4. RENDER INVENTORY ---
        function renderInventory() {
            let currentItems = JSON.parse(localStorage.getItem("mySavedItems")) || [];
            inventoryGrid.innerHTML = "";

            if (currentItems.length === 0) {
                inventoryGrid.innerHTML = '<p class="empty-message">Your inventory is completely empty. Go scan some items!</p>';
                return;
            }

            currentItems.forEach((item, index) => {
                const card = document.createElement("div");
                card.className = "item-card";

                const title = document.createElement("h3");
                title.textContent = item;

                const useButton = document.createElement("button");
                useButton.className = "use-btn";
                useButton.textContent = "Use Item";
                saveGameData()
                
                useButton.onclick = function() {
                    useItem(index, item);
                };

                card.appendChild(title);
                card.appendChild(useButton);
                inventoryGrid.appendChild(card);
            });
        }

        // --- 5. USE ITEM LOGIC ---
        function useItem(indexToRemove, itemName) {
            if (!myMonster) {
                alert("You need an active monster to use items!");
                return;
            }

            switch(itemName) {
                case "A chip":
                    myMonster.attack += 5;
                    alert(`Used [A chip]! ${myMonster.name}'s Attack increased by 5!`);
                    break;
                case "D chip":
                    myMonster.defense += 5;
                    alert(`Used [D chip]! ${myMonster.name}'s Defense increased by 5!`);
                    break;
                case "S chip":
                    myMonster.speed += 5;
                    alert(`Used [S chip]! ${myMonster.name}'s Speed increased by 5!`);
                    break;
                case "Evo Script":
                    myMonster.level += 1;
                    alert(`Used [Evo Script]! Data pulses through ${myMonster.name}... Level up!`);
                    break;
                case "Chaos chip":
                    const stats = ["attack", "defense", "speed"];
                    const randomStat = stats[Math.floor(Math.random() * stats.length)];
                    myMonster[randomStat] += 10;
                    alert(`Used [Chaos chip]! Wild energy surges! ${myMonster.name}'s ${randomStat} increased by 10!`);
                    break;
                case "Data Infuser":
                    myMonster.hp += 20;
                    alert(`Used [Data Infuser]! ${myMonster.name} recovered 20 HP!`);
                    break;
                default:
                    alert(`You used [${itemName}], but nothing happened.`);
                    break;
            }

            let currentItems = JSON.parse(localStorage.getItem("mySavedItems")) || [];
            currentItems.splice(indexToRemove, 1);
            localStorage.setItem("mySavedItems", JSON.stringify(currentItems));

            saveGameData();
            updateMonsterDisplay();
            renderInventory();
        }

        // --- INITIAL LOAD ---
        load();
        renderInventory();

        // --- AUTO-REFRESH LOOP (Checks for new items every 3 seconds) ---
        setInterval(() => {
            load();             // Re-reads ardumonGameData
            renderInventory();  // Re-reads mySavedItems and updates the screen
        }, 3000);

    </script>

</body>
</html>
