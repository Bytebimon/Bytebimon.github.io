<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3rd Console - Command Line</title>
   <link rel="icon" type="image/png" href="/Assets/Icon.png">

    
    <style>
        :root {
            --term-green: #00ff66;
            --term-dim: #004d1f;
            --bg-color: #0b0f0c;
        }

        body {
            background-color: var(--bg-color);
            color: var(--term-green);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Terminal Window Box */
        .terminal-container {
            width: 100%;
            max-width: 650px;
            background-color: #050806;
            border: 2px solid var(--term-green);
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.15);
            overflow: hidden;
        }

        /* Window Header Bar */
        .terminal-header {
            background-color: var(--term-dim);
            color: var(--term-green);
            padding: 8px 15px;
            font-size: 0.85rem;
            letter-spacing: 1px;
            border-bottom: 1px solid var(--term-green);
            text-transform: uppercase;
        }

        /* Terminal Body */
        .terminal-body {
            padding: 25px;
        }

        h1 {
            margin-top: 0;
            font-size: 1.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 8px rgba(0, 255, 102, 0.5);
        }

        p {
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .hint {
            opacity: 0.75;
            font-size: 0.9rem;
            border-left: 2px solid var(--term-green);
            padding-left: 10px;
            margin: 20px 0;
        }

        /* Command Line Input Styling */
        #actionForm {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }

        .input-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        label {
            font-weight: bold;
            white-space: nowrap;
        }

        input[type="text"] {
            flex: 1;
            background-color: #000;
            color: var(--term-green);
            border: 1px solid var(--term-green);
            padding: 10px 12px;
            font-family: inherit;
            font-size: 1rem;
            border-radius: 4px;
            outline: none;
            box-shadow: inset 0 0 5px rgba(0, 255, 102, 0.2);
        }

        input[type="text"]:focus {
            box-shadow: 0 0 8px rgba(0, 255, 102, 0.6);
        }

        button {
            background-color: transparent;
            color: var(--term-green);
            border: 1px solid var(--term-green);
            padding: 10px 20px;
            font-family: inherit;
            font-size: 1rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s ease;
            border-radius: 4px;
            align-self: flex-end;
        }

        button:hover {
            background-color: var(--term-green);
            color: var(--bg-color);
            box-shadow: 0 0 10px var(--term-green);
        }

        button:active {
            transform: scale(0.97);
        }
    </style>
</head>

<body>

    <div class="terminal-container">
        <div class="terminal-header">SYS_CONSOLE // Command Gateway</div>
        
        <div class="terminal-body">
            <h1>Console</h1>
            <p>If you haven't been here, I'll explain—just type <strong>help?</strong> in the console.</p>

            <div class="hint">
                <strong>hint:</strong> available commands:
                <br>&gt; launch byte.exe
                <br>&gt; launch info
                <br>&gt; web
                <br>&gt; launch desktop
                <br>&gt; help?
            </div>

            <form id="actionForm">
                <div class="input-group">
                    <label for="userInput">&gt;</label>
                    <input type="text" id="userInput" placeholder="Type a command..." required autocomplete="off" autofocus>
                </div>
                <button type="submit">Execute</button>
            </form>
        </div>
    </div>

    <script>
        const form = document.getElementById('actionForm');

        form.addEventListener('submit', function(event) {
            event.preventDefault();

            
            // Clean input by trimming and turning to lowercase so capitalization doesn't break commands
            const command = document.getElementById('userInput').value.trim().toLowerCase();

            if (command === "launch byte.exe") {
                window.location.href = "../Game.html";
            }
            else if (command === "launch info") {
                window.location.href = "Info.html";
            }
            else if (command === "web") {
                // Inverts theme colors to emulate a light web background
                document.body.style.backgroundColor = "#e0e0e0";
                document.body.style.color = "#000";
            }
            else if (command === "launch desktop") {
                window.location.href = "Desktop.html";
            }
            else if (command === "help?") {
                window.location.href = "story.html";
            }
            else {
                alert("Unknown command: " + command);
            }
            
            // Clear input after execution
            document.getElementById('userInput').value = "";
        });
    </script>

</body>

</html>
