<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Scanner</title>
    <link rel="icon" type="image/png" href="/Assets/Icon.png">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 14px;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #0b0f0c;
            color: #e2e8f0;
        }
        h1 {
            font-size: 1.1rem;
            margin: 0 0 4px;
            letter-spacing: 1px;
        }
        p.sub {
            margin: 0 0 12px;
            font-size: 0.8rem;
            color: #94a3b8;
        }
        .difficulty-row {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }
        .diff-btn {
            flex: 1;
            padding: 8px 4px;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #111827;
            color: #cbd5e1;
            font-weight: bold;
            font-size: 0.8rem;
            cursor: pointer;
        }
        .diff-btn.active {
            border-color: #00ff66;
            color: #00ff66;
            box-shadow: 0 0 8px rgba(0, 255, 102, 0.4);
        }
        .diff-desc {
            font-size: 0.72rem;
            color: #64748b;
            margin: 0 0 12px;
            min-height: 2.2em;
        }
        canvas {
            width: 100%;
            max-width: 460px;
            height: 60px;
            display: block;
            background: #050806;
            border: 1px solid #1e293b;
            border-radius: 6px;
        }
        .lock-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 10px 0;
        }
        #lockBtn {
            background: transparent;
            color: #00ff66;
            border: 1px solid #00ff66;
            padding: 9px 20px;
            font-family: inherit;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-radius: 4px;
            cursor: pointer;
        }
        #lockBtn:hover:not(:disabled) {
            background: #00ff66;
            color: #050806;
            box-shadow: 0 0 10px #00ff66;
        }
        #lockBtn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        #resultText {
            font-size: 0.85rem;
            min-height: 1.4em;
        }
        #ItemsGained {
            font-size: 0.85rem;
            margin-top: 10px;
            color: #cbd5e1;
        }
        #clearBtn {
            margin-top: 10px;
            background: #1e293b;
            color: #cbd5e1;
            border: 1px solid #334155;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
        }
        #clearBtn:hover {
            background: #334155;
        }
    </style>
</head>
<body>

    <h1>📡 DIGITAL SIGNAL SCANNER</h1>
    <p class="sub">Pick a difficulty, then click "Lock Signal" while the needle is inside the green zone.</p>

    <div class="difficulty-row">
        <button class="diff-btn active" id="diff-easy" onclick="selectDifficulty('easy')">Easy</button>
        <button class="diff-btn" id="diff-medium" onclick="selectDifficulty('medium')">Medium</button>
        <button class="diff-btn" id="diff-hard" onclick="selectDifficulty('hard')">Hard</button>
    </div>
    <p class="diff-desc" id="diffDesc"></p>

    <canvas id="scanCanvas" width="460" height="60"></canvas>

    <div class="lock-row">
        <button id="lockBtn" onclick="lockSignal()">Lock Signal</button>
        <span id="resultText">Ready to scan.</span>
    </div>

    <p id="ItemsGained">🎒 Inventory: Empty</p>
    <button id="clearBtn" onclick="clearCache()">Clear Saved Inventory</button>

    <script>
        const canvas = document.getElementById('scanCanvas');
        const ctx = canvas.getContext('2d');
        const lockBtn = document.getElementById('lockBtn');
        const resultText = document.getElementById('resultText');
        const itemsGainedElement = document.getElementById('ItemsGained');
        const diffDesc = document.getElementById('diffDesc');

        // ---------- Difficulty configuration ----------
        // zoneWidth: fraction of the bar that counts as a "hit" (0-1)
        // speed: how fast the needle sweeps (higher = faster/harder to time)
        // successChance: chance of getting an item on a successful lock
        // missChance: small consolation chance of a common item on a missed lock
        // pool: weighted loot table for a successful lock
        const DIFFICULTIES = {
            easy: {
                zoneWidth: 0.42,
                speed: 0.9,
                successChance: 0.9,
                missChance: 0.15,
                desc: 'Big target, slow needle. High odds, common rewards only.',
                pool: [
                    { name: 'A chip', weight: 40 },
                    { name: 'D chip', weight: 40 },
                    { name: 'S chip', weight: 20 }
                ]
            },
            medium: {
                zoneWidth: 0.24,
                speed: 1.6,
                successChance: 0.65,
                missChance: 0.1,
                desc: 'Smaller target, faster needle. Chance at Evo Scripts.',
                pool: [
                    { name: 'A chip', weight: 25 },
                    { name: 'D chip', weight: 25 },
                    { name: 'S chip', weight: 25 },
                    { name: 'Evo Script', weight: 20 },
                    { name: 'Chaos chip', weight: 5 }
                ]
            },
            hard: {
                zoneWidth: 0.12,
                speed: 2.4,
                successChance: 0.4,
                missChance: 0.05,
                desc: 'Tiny target, fast needle. Low odds, but the best loot.',
                pool: [
                    { name: 'Evo Script', weight: 25 },
                    { name: 'Chaos chip', weight: 35 },
                    { name: 'Data Infuser', weight: 30 },
                    { name: 'S chip', weight: 10 }
                ]
            }
        };
        const COMMON_POOL = [
            { name: 'A chip', weight: 50 },
            { name: 'D chip', weight: 50 }
        ];

        let currentDifficulty = 'easy';
        let needlePos = 0; // 0 to 1
        let needleDir = 1;
        let zoneStart = 0.3; // where the target zone starts (0-1)
        let locked = false;
        let currentItems = JSON.parse(localStorage.getItem('mySavedItems')) || [];

        function refreshInventoryDisplay() {
            currentItems = JSON.parse(localStorage.getItem('mySavedItems')) || [];
            itemsGainedElement.textContent = currentItems.length > 0
                ? `🎒 Inventory: ${currentItems.join(', ')}`
                : '🎒 Inventory: Empty';
        }
        refreshInventoryDisplay();

        function pickWeighted(pool) {
            const total = pool.reduce((sum, item) => sum + item.weight, 0);
            let roll = Math.random() * total;
            for (const item of pool) {
                if (roll < item.weight) return item.name;
                roll -= item.weight;
            }
            return pool[pool.length - 1].name;
        }

        function randomizeZone() {
            const cfg = DIFFICULTIES[currentDifficulty];
            zoneStart = Math.random() * (1 - cfg.zoneWidth);
        }

        function selectDifficulty(level) {
            currentDifficulty = level;
            document.querySelectorAll('.diff-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('diff-' + level).classList.add('active');
            diffDesc.textContent = DIFFICULTIES[level].desc;
            randomizeZone();
            needlePos = 0;
            needleDir = 1;
        }

        function drawScene() {
            const w = canvas.width;
            const h = canvas.height;
            ctx.clearRect(0, 0, w, h);

            const cfg = DIFFICULTIES[currentDifficulty];

            // track
            ctx.fillStyle = '#111827';
            ctx.fillRect(0, h / 2 - 8, w, 16);

            // target zone
            ctx.fillStyle = 'rgba(0, 255, 102, 0.35)';
            ctx.fillRect(zoneStart * w, h / 2 - 8, cfg.zoneWidth * w, 16);

            // needle
            const x = needlePos * w;
            ctx.fillStyle = locked ? '#f59e0b' : '#00ff66';
            ctx.fillRect(x - 2, h / 2 - 20, 4, 40);
        }

        function tick() {
            if (!locked) {
                const cfg = DIFFICULTIES[currentDifficulty];
                needlePos += needleDir * cfg.speed * 0.012;
                if (needlePos >= 1) { needlePos = 1; needleDir = -1; }
                if (needlePos <= 0) { needlePos = 0; needleDir = 1; }
            }
            drawScene();
            requestAnimationFrame(tick);
        }

        function lockSignal() {
            if (locked) return;
            locked = true;
            lockBtn.disabled = true;

            const cfg = DIFFICULTIES[currentDifficulty];
            const hit = needlePos >= zoneStart && needlePos <= zoneStart + cfg.zoneWidth;

            let awarded = null;
            if (hit) {
                if (Math.random() < cfg.successChance) {
                    awarded = pickWeighted(cfg.pool);
                }
            } else {
                if (Math.random() < cfg.missChance) {
                    awarded = pickWeighted(COMMON_POOL);
                }
            }

            if (awarded) {
                currentItems.push(awarded);
                localStorage.setItem('mySavedItems', JSON.stringify(currentItems));
                refreshInventoryDisplay();
                resultText.textContent = hit
                    ? `🎉 Signal locked! You found a [${awarded}]!`
                    : `📶 Missed the zone, but salvaged a [${awarded}] from the noise.`;
            } else {
                resultText.textContent = hit
                    ? '📡 Signal locked, but no data came through this time.'
                    : '❌ Missed the zone. Nothing found.';
            }

            setTimeout(() => {
                locked = false;
                lockBtn.disabled = false;
                randomizeZone();
                resultText.textContent += ' Ready for another scan.';
            }, 1000);
        }

        function clearCache() {
            localStorage.removeItem('mySavedItems');
            currentItems = [];
            refreshInventoryDisplay();
            resultText.textContent = 'Inventory cleared.';
        }

        // Spacebar as an alternate way to lock the signal
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                lockSignal();
            }
        });

        selectDifficulty('easy');
        requestAnimationFrame(tick);
    </script>
</body>
</html>
