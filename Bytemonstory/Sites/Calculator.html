<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <style>
        :root {
            --bg: #0f0f1a;
            --primary: #4e44ce;
            --accent: #ff6f61;
            --text: #e0e0e0;
            --glass: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            font-family: 'Inter', sans-serif;
            color: var(--text);
        }

        .calculator {
            background: var(--glass);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            padding: 20px;
            width: 340px;
        }

        .display {
            background: var(--primary);
            border-radius: 10px;
            padding: 15px;
            font-size: 2rem;
            text-align: right;
            overflow-x: auto;
            color: #fff;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 20px;
        }

        button {
            background: var(--glass);
            border: none;
            border-radius: 10px;
            padding: 15px;
            font-size: 1.2rem;
            color: var(--text);
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
        }

        button:hover {
            background: var(--primary);
            color: #fff;
        }

        button:active {
            transform: scale(0.95);
        }

        .back {
            margin-top: 15px;
            display: block;
            text-align: center;
            color: var(--accent);
            text-decoration: none;
            font-weight: bold;
        }

        .back:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="calculator">
        <div class="display" id="display">0</div>
        <div class="buttons">
            <button data-value="7">7</button>
            <button data-value="8">8</button>
            <button data-value="9">9</button>
            <button data-action="clear">C</button>

            <button data-value="4">4</button>
            <button data-value="5">5</button>
            <button data-value="6">6</button>
            <button data-action="divide">÷</button>

            <button data-value="1">1</button>
            <button data-value="2">2</button>
            <button data-value="3">3</button>
            <button data-action="multiply">×</button>

            <button data-value="0">0</button>
            <button data-value=".">.</button>
            <button data-action="equals">=</button>
            <button data-action="subtract">‑</button>

            <button data-action="add" style="grid-column: span 4;">+</button>
        </div>
        <a href="../Browser.html" class="back">← Back to Browser</a>
    </div>
    <script>
        const display = document.getElementById('display');
        let current = '';
        let operator = null;
        let previous = null;

        function updateDisplay() {
            display.textContent = current || '0';
        }

        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', () => {
                const value = btn.dataset.value;
                const action = btn.dataset.action;
                if (value !== undefined) {
                    current += value;
                } else if (action) {
                    if (action === 'clear') {
                        current = '';
                        previous = null;
                        operator = null;
                    } else if (action === 'equals') {
                        if (operator && previous !== null) {
                            const a = parseFloat(previous);
                            const b = parseFloat(current);
                            let result = 0;
                            switch (operator) {
                                case '+': result = a + b; break;
                                case '-': result = a - b; break;
                                case '*': result = a * b; break;
                                case '/': result = b !== 0 ? a / b : 'Error'; break;
                            }
                            current = String(result);
                            operator = null;
                            previous = null;
                        }
                    } else {
                        if (current) {
                            previous = current;
                            current = '';
                        }
                        operator = { add: '+', subtract: '-', multiply: '*', divide: '/' }[action];
                    }
                }
                updateDisplay();
            });
        });
        updateDisplay();
    </script>
</body>

</html>
