<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ardumon Save Viewer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background-color: rgb(0, 0, 0);">

    <!-- Use <pre> to preserve JSON formatting spacing -->
    <pre style="color: #00970f;" id="output-text"></pre>

<script>
    // Global variable to hold game data
    let gameData = null;

    function load() {
        const savedData = localStorage.getItem('ardumonGameData');
        
        if (savedData) {
            gameData = JSON.parse(savedData);
            console.log("Game loaded.", gameData);
            draw(); // Trigger display after loading
        } else {
            document.getElementById("output-text").innerText = "No saved game data found.";
        }
    }

    function draw() {
        if (gameData) {
            // JSON.stringify(..., null, 2) formats the object into readable JSON
            document.getElementById("output-text").innerText = JSON.stringify(gameData, null, 2);
        }
    }

    // Run load() automatically once the DOM content is fully loaded
    window.addEventListener('DOMContentLoaded', load);
</script>
</body>
</html>
