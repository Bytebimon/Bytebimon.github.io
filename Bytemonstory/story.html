<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Story - 3rd Console</title>
    
    <style>
        /* Dark cyber-terminal styling */
        :root {
            --term-green: #00ff66;
            --term-dim: #004d1f;
            --bg-color: #0b0f0c;
        }

        body {
            background-color: var(--bg-color);
            color: var(--term-green);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Console Window Box */
        .terminal-container {
            width: 100%;
            max-width: 650px;
            background-color: #050806;
            border: 2px solid var(--term-green);
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.15);
            overflow: hidden;
        }

        /* Window Title Bar */
        .terminal-header {
            background-color: var(--term-dim);
            color: var(--term-green);
            padding: 8px 15px;
            font-size: 0.85rem;
            letter-spacing: 1px;
            border-bottom: 1px solid var(--term-green);
            text-transform: uppercase;
        }

        /* Text Display Area */
        .terminal-body {
            padding: 25px;
            min-height: 120px;
            display: flex;
            align-items: center;
        }

        #output-text {
            color: var(--term-green);
            font-size: 1.1rem;
            line-height: 1.6;
            margin: 0;
            white-space: pre-wrap; /* Allows text wrapping while keeping formatting */
            word-break: break-word;
            text-shadow: 0 0 5px rgba(0, 255, 102, 0.4);
            animation: fadeIn 0.3s ease-in-out;
        }

        /* Interactive Controls */
        .action-buttons {
            padding: 15px 25px 25px;
            display: flex;
            justify-content: flex-end;
        }

        button {
            background-color: transparent;
            color: var(--term-green);
            border: 1px solid var(--term-green);
            padding: 10px 24px;
            font-family: inherit;
            font-size: 1rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s ease;
            border-radius: 4px;
        }

        button:hover {
            background-color: var(--term-green);
            color: var(--bg-color);
            box-shadow: 0 0 10px var(--term-green);
        }

        button:active {
            transform: scale(0.97);
        }

        /* Subtle fade animation when line changes */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="terminal-container">
        <div class="terminal-header">SYS_CONSOLE // Node_03</div>
        
        <div class="terminal-body">
            <pre id="output-text"></pre>
        </div>

        <div class="action-buttons">
            <button id="Next" onclick="next()">Next &gt;</button>
        </div>
    </div>

    <script>
        // Array simplifies storing and editing story dialogues
        const storyLines = [
            "So, you haven't been here before...",
            "Well, no one has for a long time, I think.",
            "Right now, you're in the 3rd console.",
            "It's a continuum between Earth and the digital world...",
            "Where Bytes get transferred globally.",
            "But, when a virus came...",
            "It completely shredded the code and created things now known as Bytemon and Bitmon.",
            "Bitmon are generally smaller than Bytemon...",
            "So they can travel between the digital world and your world easier using this console and the terminal.",
            "Whereas we, Bytemon, have to split across all 3 consoles and after some time come back together.",
            "But just like how you guys have wars, we had a digital one...",
            "Where we all selected a group and stayed with it.",
            "As time went on, there were only 3 left:",
            "The Embassy of Corruption, Anti-Viruses, and what I can only call Libra Equilibrium.",
            "Now that's enough about us. I will now tell you why you're important in this.",
            "You have been selected to be part of a group of people we call Byte Rangers.",
            "So far, your job is to stop Corrupted and Berserk Bytemon.",
            "you will also get your own byte or bit mon to help you, but remember it is saved to your disk and is permanently with you",
            "when your in the console use launch desktop to enter a more familiar work space"
        ];

        let storyIndex = 0;
        const output = document.getElementById("output-text");

        function updateStory() {
            if (storyIndex < storyLines.length) {
                // Re-trigger visual animation per line change
                output.style.animation = 'none';
                output.offsetHeight; /* trigger reflow */
                output.style.animation = null;

                output.innerText = storyLines[storyIndex];
            } else {
                output.innerText = "[TRANSMISSION ENDED], Redirecting...";
                window.location.href = "console.html";
                document.getElementById("Next").disabled = true;
                document.getElementById("Next").style.opacity = "0.5";
                document.getElementById("Next").style.cursor = "not-allowed";
            }
        }

        function next() {
            storyIndex++;
            updateStory();
        }

        // Display initial story text on page load
        updateStory();
    </script>
</body>
</html>
