<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <style>
        body {
            /* Sets the path to your image file */
            background-image: url('Icons/HomeScreen.jpg'); 
            
            /* Prevents the image from repeating as a grid */
            background-repeat: no-repeat; 
            
            /* Scales the image to cover the entire viewport */
            background-size: cover; 
            
            /* Centers the image horizontally and vertically */
            background-position: center; 
            
            /* Keeps the background fixed in place while scrolling */
            background-attachment: fixed; 
        }
    </style>

</body>
</html>
