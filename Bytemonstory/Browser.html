<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bytebimon Browser</title>
    <link rel="stylesheet" href="../style.css" />
    <script src="./browser.js" defer></script>
</head>

<body>
    <div class="browser-shell">
        <div class="toolbar glass">
            <form id="actionForm">
                <div class="input-group">
                    <label for="userInput">&gt;</label>
                    <input type="text" id="userInput" placeholder="Type a command..." required autocomplete="off"
                        autofocus>
                </div>
                <button type="submit">Execute</button>
            </form>
            <button id="backBtn" disabled>←</button>
            <button id="forwardBtn" disabled>→</button>
            <button id="reloadBtn">⟳</button>
            <button id="homeBtn">Home</button>
        </div>

        <p>You can visit sites such as:</p>
        <ul>
            <li>binary.load</li>
            <li>adventure.net</li>
            <li>news</li>
            <li>calculator.com</li>
            <li>bytebimon.com</li>
        </ul>

        <iframe id="webView" src="about:blank" sandbox="allow-same-origin allow-scripts allow-forms"
            style="width:100%; height:80vh; border:none;"></iframe>
    </div>

</body>

</html>
