<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-adsense-account" content="ca-pub-7329195604411751">
    <title>How to play</title>
    <link rel="icon" type="image/png" href="/Assets/Icon.png">

    
    <style>
        /* Dark cyber-terminal styling */
        :root {
            --term-green: #00ff66;
            --term-dim: #004d1f;
            --bg-color: #0b0f0c;
        }

        body {
            background-color: var(--bg-color);
            color: var(--term-green);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Console Window Box */
        .terminal-container {
            width: 100%;
            max-width: 650px;
            background-color: #050806;
            border: 2px solid var(--term-green);
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.15);
            overflow: hidden;
        }

        /* Window Title Bar */
        .terminal-header {
            background-color: var(--term-dim);
            color: var(--term-green);
            padding: 8px 15px;
            font-size: 0.85rem;
            letter-spacing: 1px;
            border-bottom: 1px solid var(--term-green);
            text-transform: uppercase;
        }

        /* Text Display Area */
        .terminal-body {
            padding: 25px;
            min-height: 120px;
            display: flex;
            align-items: center;
        }

        #output-text {
            color: var(--term-green);
            font-size: 1.1rem;
            line-height: 1.6;
            margin: 0;
            white-space: pre-wrap; /* Allows text wrapping while keeping formatting */
            word-break: break-word;
            text-shadow: 0 0 5px rgba(0, 255, 102, 0.4);
            animation: fadeIn 0.3s ease-in-out;
        }

        /* Interactive Controls */
        .action-buttons {
            padding: 15px 25px 25px;
            display: flex;
            justify-content: flex-end;
        }

        button {
            background-color: transparent;
            color: var(--term-green);
            border: 1px solid var(--term-green);
            padding: 10px 24px;
            font-family: inherit;
            font-size: 1rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s ease;
            border-radius: 4px;
        }

        button:hover {
            background-color: var(--term-green);
            color: var(--bg-color);
            box-shadow: 0 0 10px var(--term-green);
        }

        button:active {
            transform: scale(0.97);
        }

        /* Subtle fade animation when line changes */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="terminal-container">
        <div class="terminal-header">SYS_CONSOLE // Node_03</div>
        
        <div class="terminal-body">
            <pre id="output-text"></pre>
        </div>

        <div class="action-buttons">
            <button id="Next" onclick="next()">Next &gt;</button>
        </div>
    </div>

    <script>
        // Array simplifies storing and editing story dialogues
        const storyLines = [
            "Welcome to the bit moniter",
            "its where you can monitor your Byte/bitmon",
            "and nuture them, etc",
            "but most importatly there are battle functions",
            "like raids, Pvp and Local battles ",
            "all accesable through the battle tab",
            "In menu there is feeding, training a save button, settings AND MORE!!",
            "I cant tell you everything because I havent been there myself",
            "But make sure to do a bit of testing!!!",
            "Thats all you'll here from me for now, BYE and Good like Byte Ranger",
        ];

        let storyIndex = 0;
        const output = document.getElementById("output-text");

        function updateStory() {
            if (storyIndex < storyLines.length) {
                // Re-trigger visual animation per line change
                output.style.animation = 'none';
                output.offsetHeight; /* trigger reflow */
                output.style.animation = null;

                output.innerText = storyLines[storyIndex];
            } else {
                output.innerText = "[TRANSMISSION ENDED], Redirecting...";
                document.getElementById("Next").disabled = true;
                document.getElementById("Next").style.opacity = "0.5";
                document.getElementById("Next").style.cursor = "not-allowed";
                setTimeout(() => {
                    window.location.href = "Game.html";
                }, 1200);
            }
        }

        function next() {
            storyIndex++;
            updateStory();
        }

        // Display initial story text on page load
        updateStory();
    </script>
</body>
</html>
